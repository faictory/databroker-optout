[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "databroker-optout"
version = "0.1.0"
description = "Audit and generate removal requests for personal information on data brokers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "tomli>=1.1.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["databroker_optout"]

[tool.setuptools.package-data]
databroker_optout = ["brokers.json"]
